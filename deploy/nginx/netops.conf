# NetOps 平台前端 Nginx 配置模板（生产环境：Nginx 托管前端静态 + 反向代理 API/WS/MCP）
# 部署位置：
#   - 宝塔（BT）环境：/www/server/panel/vhost/nginx/netops.conf
#   - Ubuntu 标准：/etc/nginx/sites-available/netops -> ln -sf 到 sites-enabled/netops
# 配套说明：Go 不再托管前端（web_port 概念已移除），初始化完成后 API 端口绑定 127.0.0.1，
# 外部一律经 Nginx 的 40000 端口访问静态页面与反代接口。
server {
    listen 40000;
    server_name _;
    root /opt/netops-platform/web;
    index index.html;
    client_max_body_size 100m;

    # gzip 压缩静态资源（对标 Go gzipStatic）
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml font/woff2;

    # SPA 入口：no-store 强制每次重新下载 index.html（防止升级后浏览器复用旧缓存）
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 前端 SPA 静态资源（history 路由回退 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Go（初始化完成后 Go 仅绑定 127.0.0.1）
    location /api/ {
        proxy_pass http://127.0.0.1:30821;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # WebSocket 升级代理
    location /ws {
        proxy_pass http://127.0.0.1:30821;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # MCP 能力端点
    location /mcp/ {
        proxy_pass http://127.0.0.1:30821;
        proxy_set_header Host $host;
    }
}

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MessageBox 定位验证</title>
<link rel="stylesheet" href="dist/assets/element-plus-B0PfE1Xr.css">
<link rel="stylesheet" href="dist/assets/index-DxVwLC0t.css">
<style>
  html, body { margin: 0; height: 100%; background: #10141c; }
  /* 模拟系统主题变量（与 styles/variables 一致的核心项） */
  :root {
    --np-bg-elevated: #1b2130;
    --np-border: #2a3245;
    --np-shadow-md: 0 8px 24px rgba(0,0,0,.45);
    --el-messagebox-border-radius: 12px;
  }
  body { display: block; }
</style>
</head>
<body>
<!-- 模拟 ElMessageBox 真实 DOM：el-overlay > el-overlay-message-box > el-message-box -->
<div class="el-overlay is-message-box" style="z-index: 2001;">
  <div class="el-overlay-message-box" role="dialog" aria-modal="true" aria-label="退出登录">
    <div class="el-message-box is-center" tabindex="-1">
      <div class="el-message-box__header show-close">
        <div class="el-message-box__title"><span>退出登录</span></div>
        <button type="button" class="el-message-box__headerbtn" aria-label="Close"><span class="el-message-box__close">×</span></button>
      </div>
      <div class="el-message-box__content">
        <div class="el-message-box__container"><div class="el-message-box__message"><p>确定？</p></div></div>
      </div>
      <div class="el-message-box__btns">
        <button type="button" class="el-button">取消</button>
        <button type="button" class="el-button el-button--primary">确定</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
